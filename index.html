public class Fibonacci{
    static int fibonacciRec(int n ){
        if(n<=1){
            return n;
        }

        return fibonacciRec(n-1) + fibonacciRec(n-2);
    }

    static int fibonacciIter(int n){
        if(n<=1){
            return n;
        }

        int a =0; 
        int b = 1;
        int c;

        for(int i = 2; i<=n ;i++){
            c= a+b;
            a= b;
            b=c;

        }

    }

class Node {
    char ch;
    int freq;
    Node left, right;

    Node(char ch, int freq) {
        this.ch = ch;
        this.freq = freq;
    }

    Node(int freq, Node left, Node right) {
        this.ch = '-';
        this.freq = freq;
        this.left = left;
        this.right = right;
    }
}

public class Huffman {

    static void printCode(Node root, String code) {
        if (root == null) {
            return;
        }

        // Leaf node
        if (root.left == null && root.right == null) {
            System.out.println(root.ch + " : " + code);
            return;
        }

        printCode(root.left, code + "0");
        printCode(root.right, code + "1");
    }

    public static void main(String[] args) {

        char[] chars = {'a', 'b', 'c', 'd', 'e', 'f'};
        int[] freq = {5, 9, 12, 13, 16, 45};

        PriorityQueue<Node> pq =
            new PriorityQueue<>((a, b) -> a.freq - b.freq);

        // Add each character as a node
        for (int i = 0; i < chars.length; i++) {
            pq.add(new Node(chars[i], freq[i]));
        }

        // Combine two minimum-frequency nodes
        while (pq.size() > 1) {
            Node left = pq.poll();
            Node right = pq.poll();

            Node parent = new Node(
                left.freq + right.freq, left, right
            );

            pq.add(parent);
        }

        // Remaining node is the root
        Node root = pq.poll();

        // Print Huffman codes
        System.out.println("Huffman codes are:");
        printCode(root, "");
    }
}

public class Knapsack{
    public static int knapsack(int[] weight, int[] profit , int capacity){
        int n = weight.length;
        int[][]dp = new int[n+1][capacity+1];

        //build dp table
        for(int i = 1; i <=n ; i++){
            for(int w =0; w <= capacity ; w++){
                //if curr item fits
                if(weight[i-1]<= w){
                    dp[i][w] = Math.max(profit[i-1]+ dp[i-1] [w-weight[i-1]] , dp[i-1][w]);
                }
                else{
                    dp[i][w] = dp[i-1][w];
                }
                }
            }
        return dp[n][capacity];
        
        }

        int[] profit = {20,30,15,10};

        int capacity = 7;
        System.out.println("Max Profit " + knapsack(weight , profit , capacity));
        
    }
    
    }

    static int N = 4;
    static int[][] board = new int[N][N];

    // Check if queen can be placed safely
    static boolean isSafe(int row, int col) {

        // Check same column above
        for (int i = 0; i < row; i++) {
            if (board[i][col] == 1)
                return false;
        }

        // Check upper-left diagonal
        for (int i = row - 1, j = col - 1; i >= 0 && j >= 0; i--, j--) {
            if (board[i][j] == 1)
                return false;
        }

        // Check upper-right diagonal
        for (int i = row - 1, j = col + 1; i >= 0 && j < N; i--, j++) {
            if (board[i][j] == 1)
                return false;
        }

        return true;
    }

    // Place queens row by row
    static boolean solve(int row) {

        // All queens placed
        if (row == N)
            return true;

        // Try every column in current row
        for (int col = 0; col < N; col++) {

            if (isSafe(row, col)) {

                board[row][col] = 1;

                if (solve(row + 1))
                    return true;

                // Backtrack
                board[row][col] = 0;
            }
        }

        return false;
    }

    public static void main(String[] args) {

        // First queen is already placed at (0, 1)
        board[0][1] = 1;

        if (solve(1)) {
            System.out.println("Solution:");
            for (int i = 0; i < N; i++) {
                for (int j = 0; j < N; j++) {
                    System.out.print(board[i][j] + " ");
                }
                System.out.println();
            }
        } else {
            System.out.println("No solution exists");
        }
    }
}`,
            5: `import java.util.*;

public class QuickSort {

    // Deterministic Quick Sort
    static int partition(int[] arr, int low, int high) {

        int pivot = arr[high]; // Fixed pivot: last element
        int i = low - 1;

        for (int j = low; j < high; j++) {
            if (arr[j] <= pivot) {
                i++;

                int temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
        }

        int temp = arr[i + 1];
        arr[i + 1] = arr[high];
        arr[high] = temp;

        return i + 1;
    }

    static void quickSort(int[] arr, int low, int high) {

        if (low < high) {
            int pi = partition(arr, low, high);

            quickSort(arr, low, pi - 1);
            quickSort(arr, pi + 1, high);
        }
    }

    // Randomized Quick Sort
    static int randomizedPartition(int[] arr, int low, int high) {

        Random rand = new Random();

        // Choose a random pivot index
        int randomIndex = low + rand.nextInt(high - low + 1);

        // Swap random pivot with last element
        int temp = arr[randomIndex];
        arr[randomIndex] = arr[high];
        arr[high] = temp;

        // Use normal partition
        return partition(arr, low, high);
    }

    static void randomizedQuickSort(int[] arr, int low, int high) {

        if (low < high) {
            int pi = randomizedPartition(arr, low, high);

            randomizedQuickSort(arr, low, pi - 1);
            randomizedQuickSort(arr, pi + 1, high);
        }
    }

    public static void main(String[] args) {

        int[] arr1 = {8, 3, 1, 7, 0, 10, 2};
        int[] arr2 = arr1.clone();

        // Deterministic Quick Sort
        quickSort(arr1, 0, arr1.length - 1);

        System.out.println("Deterministic Quick Sort:");
        System.out.println(Arrays.toString(arr1));

        // Randomized Quick Sort
        randomizedQuickSort(arr2, 0, arr2.length - 1);

        System.out.println("Randomized Quick Sort:");
        System.out.println(Arrays.toString(arr2));
    }
}`,
